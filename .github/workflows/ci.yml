name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Reject tracked credentials
        run: pnpm security:secrets

      - name: Audit production dependencies
        run: pnpm security:audit

      - name: Check types
        run: pnpm typecheck

      - name: Lint source
        run: pnpm lint

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  database:
    name: Database migrations and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up pnpm
        uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
        with:
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.13

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start isolated Supabase
        run: pnpm exec supabase start

      - name: Run database contract tests
        run: pnpm db:test

      - name: Show Supabase diagnostics on failure
        if: failure()
        run: |
          pnpm exec supabase status || true
          docker ps -a --filter "name=supabase"

      - name: Stop isolated Supabase
        if: always()
        run: pnpm exec supabase stop --no-backup
