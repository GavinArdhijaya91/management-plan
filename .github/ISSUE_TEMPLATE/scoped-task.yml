name: '✨ Task idea'
description: Suggest a small, clear task that one person can finish in one PR.
title: 'task: '
labels:
  - triage
body:
  - type: markdown
    attributes:
      value: |
        Keep it small and focused — one PR = one idea. If you are not sure, open it anyway and we will help shape it.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who has the problem and why does it matter? No need for technical jargon.
      placeholder: |
        As a small business owner, I want ... so that ...
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: What should be done? (in scope)
      description: The smallest useful change.
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: What is NOT included? (out of scope)
      description: Helps keep the task small.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: How do we know it is done?
      description: Checklist a reviewer can verify.
      placeholder: |
        - [ ] Docs updated
        - [ ] `pnpm test` still passes
        - [ ] Screenshot added for UI change
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Where to look? (files or docs)
      description: Point to relevant files, pages, or docs like DOMAIN_GLOSSARY.md.
    validations:
      required: false
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      description: How risky is this change?
      options:
        - Docs only (safest)
        - Small UI change
        - App behavior (needs login)
        - Database or permissions (needs extra review)
        - Deployment or external service
    validations:
      required: true
  - type: checkboxes
    id: ready
    attributes:
      label: Ready check
      options:
        - label: This does not need real secrets or private user data to verify.
          required: true
        - label: This can be done in one focused pull request.
          required: true
