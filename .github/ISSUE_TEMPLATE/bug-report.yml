name: '🐛 Bug report'
description: Tell us what broke — we will help fix it. Please use fake data only.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please use **fake data only** — no real passwords, tokens, emails, or business numbers.
        If this is a security issue (you can see another workspace's data), report it **privately** at https://github.com/GavinArdhijaya91/management-plan/security/advisories/new instead.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
      placeholder: |
        I opened ... and clicked ...
        I expected ... but I saw ...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it? (step by step)
      description: Use fake data and keep it as short as possible.
      placeholder: |
        1. Open /demo
        2. Click ...
        3. See error: ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      options:
        - Public or demo pages (no login)
        - Workspace pages (after login)
        - Login / invitation
        - Database or permissions (RLS)
        - Docs or contributor setup
        - Accessibility (keyboard, screen reader, contrast)
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Which version?
      description: Commit SHA, branch name, or "latest main".
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Your environment
      description: OS, browser, Node.js version (node -v), pnpm version.
      placeholder: |
        macOS 14, Chrome 126, Node 22.13, pnpm 9
    validations:
      required: false
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed all secrets, tokens, personal data, and real business content.
          required: true
