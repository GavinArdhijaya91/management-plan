name: Bug report
description: Report a reproducible problem without including private business data.
title: 'bug: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not attach credentials, invitation tokens, personal data, or real workspace content.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic data and list the smallest reliable sequence.
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Public or demo UI
        - Authenticated workspace UI
        - Authentication or invitation
        - Database, RLS, or migration
        - Documentation or contributor tooling
        - Accessibility
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit SHA, branch, or release where this occurred.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Node version, and local/staging context as relevant.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, tokens, personal data, and private business content.
          required: true
